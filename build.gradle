// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.10'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        // JCenter is read-only/offline. This scoped mirror keeps the last Android-4-compatible
        // picasso-transformations artifact available without routing other dependencies through it.
        maven {
            url 'https://maven.aliyun.com/repository/jcenter'
            content {
                includeModule 'jp.wasabeef', 'picasso-transformations'
            }
        }
    }
}
